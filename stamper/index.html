<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stamper</title>
  <link rel="icon" type="image/svg+xml" href="stamp.svg">
  <link rel="manifest" href="manifest.json">
  <script src="Sortable.min.js"></script>
  <style>
    :root {
      --bg: #f4f7f6;
      --primary: #007bff;
      --text: #333;
    }
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .version:has(~ .main-content .drop-zone.hidden) {
      display: none;
    }
    .version {
      display: flex;
      position: absolute;
      right: 0;
      bottom: 0;
      font-size: 12px;
      opacity: 0.3;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0 auto;
      padding: 4px 12px 12px;
      max-width: 1000px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      width: 100%;
    }
    .icon-btn {
      background: none;
      border: none;
      padding: 8px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .icon-btn:active {
      background: rgba(0, 0, 0, 0.1);
    }
    .icon-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      margin-top: 4px;
    }
    .drop-zone {
      flex: 1;
      border: 2px dashed #a0a0a0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      background: #ffffff;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .drop-zone.dragover {
      border-color: var(--primary);
      background-color: rgba(0, 123, 255, 0.05);
    }
    .drop-zone-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .stamp-icon {
      width: 80px;
      height: 80px;
      opacity: 0.5;
      margin-bottom: 12px;
    }
    .drop-text {
      color: #666;
      font-size: 15px;
      line-height: 1.4;
      text-align: center;
      font-weight: 500;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      align-content: start;
      touch-action: pan-y; /* Allow vertical scrolling */
    }
    .gallery.hidden, .drop-zone.hidden {
      display: none;
    }
    .image-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background-color: #ddd;
      cursor: grab;
    }
    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    /* Mimic the real stamp in the UI preview */
    .card-number {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
      pointer-events: none;
    }
    .sortable-ghost {
      opacity: 0.3;
      background-color: var(--primary);
      transform: scale(0.95);
      border-radius: 6px;
    }
    .sortable-ghost img {
      opacity: 0; /* Hide image during drag for clean ghost effect */
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="version">v1.0</div>
  <div class="header">
    <button id="resetBtn" class="icon-btn" title="Reset" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <button id="downloadBtn" class="icon-btn" title="Download" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </button>
  </div>

  <div class="main-content">
    <div id="dropZone" class="drop-zone">
      <div class="drop-zone-content">
        <img src="stamp.svg" class="stamp-icon" alt="Upload Stamp">
        <div class="drop-text">Choose photos<br>or drag and drop</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <div id="gallery" class="gallery hidden"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const gallery = document.getElementById('gallery');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let items = []; // Stores { file: File, card: HTMLElement }

    new Sortable(gallery, {
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: () => {
        // Sync array to match new DOM order
        const newItems = [];
        Array.from(gallery.children).forEach(card => {
          const item = items.find(i => i.card === card);
          if (item) newItems.push(item);
        });
        items = newItems;
        updateOrderUI(); // Instantly update text numbers only. No lag!
      }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());

    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFiles(Array.from(e.dataTransfer.files));
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFiles(Array.from(e.target.files));
    });

    function handleFiles(files) {
      for (const file of files) {
        const card = document.createElement('div');
        card.className = 'image-card';
        
        const numberBadge = document.createElement('div');
        numberBadge.className = 'card-number';
        
        const imgElem = document.createElement('img');
        // createObjectURL is instantaneous compared to FileReader
        imgElem.src = URL.createObjectURL(file); 
        
        card.appendChild(numberBadge);
        card.appendChild(imgElem);
        gallery.appendChild(card);

        items.push({ file, card, originalName: file.name });
      }

      dropZone.classList.add('hidden');
      gallery.classList.remove('hidden');
      resetBtn.disabled = false;
      downloadBtn.disabled = false;

      updateOrderUI();
    }

    // Only updates the HTML text badges, so dragging remains silky smooth
    function updateOrderUI() {
      items.forEach((item, index) => {
        item.card.querySelector('.card-number').textContent = index + 1;
      });
    }

    // Process a high-res image and return it as a Blob (much better for memory)
    function processForDownload(file, number) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          const smallestSide = Math.min(img.width, img.height);
          const fontSize = smallestSide * 0.08;
          const padding = fontSize * 0.4;
          const edgeMargin = smallestSide * 0.03;

          ctx.font = `bold ${fontSize}px sans-serif`;
          const text = number.toString();
          const metrics = ctx.measureText(text);
          const boxWidth = metrics.width + (padding * 2);
          const boxHeight = fontSize + (padding * 2);
          const boxRadius = Math.min(boxWidth, boxHeight) * 0.25;

          const boxX = canvas.width - boxWidth - edgeMargin;
          const boxY = edgeMargin;

          ctx.fillStyle = 'rgba(128, 128, 128, 0.5)';
          ctx.roundRect(boxX, boxY, boxWidth, boxHeight, boxRadius);
          ctx.fill();

          ctx.fillStyle = 'white';
          ctx.textBaseline = 'top';
          ctx.fillText(text, boxX + padding, boxY + padding + (fontSize * 0.05));

          // Export as Blob instead of Data URL to save memory
          canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.9);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    resetBtn.addEventListener('click', () => {
      items = [];
      gallery.innerHTML = '';
      gallery.classList.add('hidden');
      dropZone.classList.remove('hidden');
      fileInput.value = '';
      resetBtn.disabled = true;
      downloadBtn.disabled = true;
    });

    // The heavy lifting now happens asynchronously here
    downloadBtn.addEventListener('click', async () => {
      if (!items.length) return;

      // Lock UI and show loading spinner
      downloadBtn.disabled = true;
      resetBtn.disabled = true;

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const number = i + 1;
        
        // Wait for the canvas to process the image and return a blob
        const blob = await processForDownload(item.file, number);
        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');
        const originalBaseName = item.originalName.replace(/\.[^/.]+$/, '');
        link.download = `${number}_${originalBaseName}.jpg`;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // Stagger to prevent browser from blocking batch downloads
        await new Promise(res => setTimeout(res, 400));
        
        // Clean up memory
        URL.revokeObjectURL(url);
      }

      // Unlock UI
      downloadBtn.disabled = false;
      resetBtn.disabled = false;
    });
  </script>
</body>
</html>
