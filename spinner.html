<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Load the library -->
  <script src="spinner.js"></script>
  <style>
    button {
      padding: 10px;
    }
  </style>
</head>
<body>

  <h2>Test Loading Overlay</h2>
  <button id="trigger-btn">Test 2 Seconds</button>
  <p></p>
  <button id="fetch-btn">fetch</button>
  <div>Result</div>
  <div>
    <textarea id="result-textarea" cols="50" rows="10"></textarea>
  </div>

  <script>
    async function handleDataFetch() {
      Loader.show(); // Displays the overlay
      let data;

      try {
        const response = await fetch('https://raw.githubusercontent.com/m00291/others/refs/heads/main/sudoku/manifest.json');
        data = await response.json();
        document.getElementById('result-textarea').value = JSON.stringify(data, null, 2);
      } catch (err) {
        console.error(err);
      } finally {
        Loader.hide(); // Hides the overlay
      }
    }
  </script>

  <script>
    // Event Handler
    document.getElementById('trigger-btn').addEventListener('click', async () => {
      // 1. Show loader immediately
      Loader.show();

      // 2. Simulate async work (e.g., API call, file upload, network request)
      await new Promise(resolve => setTimeout(resolve, 2000));

      // 3. Hide loader when finished
      Loader.hide();
    });

    document.getElementById('fetch-btn').addEventListener('click', async () => { handleDataFetch(); });
  </script>
</body>
</html>
